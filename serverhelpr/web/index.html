<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServerHelpr Web</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark">SH</div><div><div class="brand-name">ServerHelpr</div><div class="brand-sub">WEB / LOCAL AI CHAT</div></div></div><div class="status"><span class="status-dot"></span><span id="model">connecting</span></div></header>
<main class="terminal"><div class="terminal-head"><div class="traffic"><i></i><i></i><i></i></div><div class="terminal-title">serverhelpr — agent session</div><div class="terminal-meta" id="targets">0 targets</div></div>
<section class="feed" id="feed"><div class="welcome block"><div class="prompt-line"><span class="sigil">›</span><span>ServerHelpr Web</span></div><div class="muted">Local AI chat powered by Ollama. Ask anything.</div><div class="hint-row"><button data-prompt="Explain how Linux systemd services work">systemd</button><button data-prompt="Help me troubleshoot a Linux server issue">troubleshooting</button><button data-prompt="Show me what you can help me with">capabilities</button></div></div></section>
<div class="composer-wrap"><div class="thinking" id="thinking"><span class="spinner"></span><span id="thinkingText">thinking</span><span class="ellipsis"></span></div><form class="composer" id="composer"><span class="prompt">›</span><textarea id="input" rows="1" placeholder="Ask ServerHelpr anything…" autofocus></textarea><button class="send" type="submit">↵</button></form><div class="composer-foot"><span><kbd>Enter</kbd> send · <kbd>Shift</kbd> + <kbd>Enter</kbd> newline</span><span id="memory">memory 0</span></div></div></main></div>
<script src="/app.js"></script></body></html>
