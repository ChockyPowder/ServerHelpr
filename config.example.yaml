ollama:
  url: http://127.0.0.1:11434
  model: qwen3.5:4b
  temperature: 0.1
  num_ctx: 8192
  num_predict: 512
  think: false
  timeout: 300

agent:
  max_steps: 16
  max_history_messages: 20


ssh:
  connect_timeout: 10
  command_timeout: 30
  known_hosts: ~/.ssh/known_hosts

servers:
  web01:
    host: 192.168.1.101
    user: aiops
    key: ~/.ssh/serverhelpr_ed25519

  # Disposable AI test box:
  # interactbox:
  #   host: 192.168.2.161
  #   user: aiops
  #   key: ~/.ssh/serverhelpr_ed25519
  #   unrestricted: true

policy:
  allowed_commands:
    - uptime
    - whoami
    - hostname
    - free -h
    - df -h
    - systemctl --failed
    - docker ps
    - ss -tulpn

  high_risk_patterns:
    - "rm "
    - "rm -"
    - "mkfs"
    - "dd "
    - "shutdown"
    - "reboot"
    - "poweroff"
    - "userdel"
    - "passwd "
    - "iptables"
    - "nft "
    - "curl |"
    - "wget |"

data_dir: ./data
